services:
  db:
    image: postgres:16.0
    volumes:
      - ./database_dumps:/app/database_dumps
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=postgres

  app:
    build:
      context: .
      args:
        IMAGE: ghcr.io/nationalarchives/tna-python-dev
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DEBUG=true
      - SECRET_KEY=abc123
      - NPM_DEVELOP_COMMAND=dev
      - DATABASE_NAME=postgres
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_HOST=db
      - DJANGO_SUPERUSER_PASSWORD=admin
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@tna.dev
      - FEATURE_BETA_BANNER_ENABLED=False
      - KEEP_ALIVE=30
      - WAGTAILAPI_BASE_URL=http://host.docker.internal:8000
    depends_on:
      - db
    ports:
      - 8002:8080
    restart: on-failure
    volumes:
      - ./:/app
      - media:/media

volumes:
  media:
  pgdata:
